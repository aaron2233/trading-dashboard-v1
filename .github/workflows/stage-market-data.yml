name: publish-results

# Durable cloud-routine fix. The scheduled routine sandbox can reach NEITHER
# Yahoo NOR GitHub (egress proxy blocks both; the claude.ai allowlist setting
# does not propagate to containers). GitHub Actions has full egress, so this
# job runs BOTH scans live and publishes small result files to the cloud-data
# branch. The routines then just WebFetch their result + draft via Gmail MCP
# (channels that bypass the sandbox proxy — capex proves it). No staged CSVs,
# no in-sandbox git/python. See project-cloud-routine-egress-allowlist.

on:
  workflow_dispatch:

  # Test trigger off the PR branch (schedule only fires from main).
  push:
    branches: [enable-publish-results]
    paths:
      - scripts/publish_results.py
      - .github/workflows/stage-market-data.yml
      - .github/workflows/publish-slot.yml

  # PUNCTUALITY: GitHub cron is best-effort — measured 1.5-3.3h late on this
  # repo in 2026-06/07 and 2.5-6.3h late by 2026-09, AND it drops most of
  # them: 09-18..09-22 the 30-min cron below fired only 2 of 16 per day,
  # with no cancelled rows (so not the concurrency dedup). One-run-per-slot
  # therefore misses slots. Instead ONE run covers every slot still ahead of
  # it: the jobs below are chained one per slot, each sleeping to its own
  # slot (publish-slot.yml). Separate jobs, not one looping job, because a
  # job is capped at 6h and 09-18's first run started 06:22 PT — 6h10m
  # before the 12:31 publish. Non-final slots already passed are skipped;
  # the final slot always publishes (cloud-data always advances). Extra
  # runs queue behind the concurrency group and just refresh after 12:31.
  #
  # Slots are PT wall times (05:40 beat-market; 08:31/10:31/12:31 lotto —
  # ~1 min AFTER each 2H bar close so the 08:35/10:35/12:35 routine windows
  # read a result computed on the just-closed bar). Crons are fixed UTC:
  # 09:00-16:30Z = 02:00-09:30 PDT; during PST they fire an hour earlier in
  # PT, which only adds lead. No PDT/PST swap needed. Keep the slot jobs
  # below in sync with these comments.
  schedule:
    - cron: "0,30 9-16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: publish-results
  # NOT cancel-in-progress: a run sleeping through its slots must survive
  # the next cron's run starting — later runs queue behind it (GitHub keeps
  # one pending run per group and cancels the rest, which is the dedup we
  # want).
  cancel-in-progress: false

jobs:
  # Chained, not parallel: each slot's job starts when the previous one
  # finishes, so no job sleeps longer than the gap to its slot. !cancelled()
  # keeps the chain going past a failed or skipped slot. Push / manual runs
  # skip the non-final slots and publish once, immediately.
  slot-0540:
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/publish-slot.yml
    with:
      slot: "05:40"

  slot-0831:
    needs: slot-0540
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/publish-slot.yml
    with:
      slot: "08:31"

  slot-1031:
    needs: slot-0831
    if: ${{ !cancelled() && github.event_name == 'schedule' }}
    uses: ./.github/workflows/publish-slot.yml
    with:
      slot: "10:31"

  slot-1231:
    needs: slot-1031
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/publish-slot.yml
    with:
      slot: "12:31"
      final: true
