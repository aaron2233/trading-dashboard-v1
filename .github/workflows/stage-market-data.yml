name: publish-results

# Durable cloud-routine fix. The scheduled routine sandbox can reach NEITHER
# Yahoo NOR GitHub (egress proxy blocks both; the claude.ai allowlist setting
# does not propagate to containers). GitHub Actions has full egress, so this
# job runs BOTH scans live and publishes small result files to the cloud-data
# branch. The routines then just WebFetch their result + draft via Gmail MCP
# (channels that bypass the sandbox proxy — capex proves it). No staged CSVs,
# no in-sandbox git/python. See project-cloud-routine-egress-allowlist.

on:
  workflow_dispatch:

  # Test trigger off the PR branch (schedule only fires from main).
  push:
    branches: [enable-publish-results]
    paths:
      - scripts/publish_results.py
      - .github/workflows/stage-market-data.yml

  # PUNCTUALITY: GitHub cron is best-effort — measured 1.5-3.3h late on this
  # repo in 2026-06/07 and 2.5-6.3h late by 2026-09. A cron mapped 1:1 to a
  # publish target cannot absorb that: once the delay exceeds the lead, the
  # run finds its target already passed and publishes late (the 08:31 slot
  # was landing at 09:30-11:07 PT for weeks). So: fire a cron every 30 min
  # through the morning and let EVERY run sleep to the NEXT slot still ahead
  # of it (scripts/sleep_until_pt.py with the full slot list). The
  # concurrency group below serializes them — one run holds each slot,
  # GitHub cancels the surplus pending runs, and runs that start after the
  # last slot publish immediately (harmless post-close refresh).
  #
  # Slots are PT wall times (05:40 beat-market; 08:31/10:31/12:31 lotto —
  # ~1 min AFTER each 2H bar close so the 08:35/10:35/12:35 routine windows
  # read a result computed on the just-closed bar). Crons are fixed UTC:
  # 09:00-16:30Z = 02:00-09:30 PDT; during PST they fire an hour earlier in
  # PT, which only adds lead. No PDT/PST swap needed. Keep the slot list in
  # the "Sleep until next slot" step in sync with these comments.
  schedule:
    - cron: "0,30 9-16 * * 1-5"

permissions:
  contents: write

concurrency:
  group: publish-results
  # NOT cancel-in-progress: a run sleeping toward its slot must survive the
  # next cron's run starting — later runs queue behind it (GitHub keeps one
  # pending run per group and cancels the rest, which is the dedup we want).
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Scheduled runs sleep up to 5h (sleep_until_pt.py cap) waiting for the
    # next slot, then the scans need a few minutes.
    timeout-minutes: 330
    steps:
      - name: Checkout (triggering branch — holds scripts + src)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e . "yfinance==1.3.0"

      # Hold until the next PT slot. Deps install BEFORE the sleep so the
      # scans start fetching at the slot, not minutes after. Push / manual
      # runs skip the wait.
      - name: Sleep until next slot (PT)
        if: github.event_name == 'schedule'
        run: python3 scripts/sleep_until_pt.py "05:40,08:31,10:31,12:31"

      - name: Run both scans live + write results
        run: |
          python scripts/publish_results.py \
            --out results_out \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      # Freshness contract: cloud-data must ALWAYS advance, even when the
      # scan step crashed — otherwise the previous window's ACTIONABLE:YES
      # file stays latest and the routine re-emails stale trades as fresh.
      - name: Ensure result files exist (failure fallback)
        if: always()
        run: |
          mkdir -p results_out
          for f in lotto_result.md beat_market_result.md; do
            if [ ! -f "results_out/$f" ]; then
              {
                echo "GENERATED: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                echo "ACTIONABLE: YES"
                echo "STATUS: FAILED"
                echo "SUBJECT: Scan pipeline FAILED — $f not produced"
                echo "---"
                echo "⚠️ The publish job failed before writing this result" \
                     "(Actions run ${GITHUB_RUN_ID}). Do NOT trade off any" \
                     "earlier scan email — its levels are stale."
              } > "results_out/$f"
            fi
          done

      - name: Publish results to cloud-data branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd results_out
          git init -q
          git checkout -q -b cloud-data
          git add -A
          git -c user.email='github-actions[bot]@users.noreply.github.com' \
              -c user.name='github-actions[bot]' \
              commit -qm "publish results (run ${GITHUB_RUN_ID})"
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            cloud-data
